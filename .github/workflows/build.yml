name: Test and build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/js/display.js
      - run: node --check static/js/admin.js
      - run: node tests/test_display_state.js

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem windows\*.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error $_ }
              $Failed = $true
            }
          }
          if ($Failed) { throw 'PowerShell validation failed' }
      - name: Build Windows package
        shell: cmd
        run: build.bat
      - name: Create zip
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION).Trim()
          Compress-Archive -Path dist\* -DestinationPath "PreciousMetalsSignage-v$Version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PreciousMetalsSignage-Windows
          path: PreciousMetalsSignage-v*-windows.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Version = (Get-Content VERSION).Trim()
          $Tag = '${{ github.ref_name }}'
          $Zip = "PreciousMetalsSignage-v$Version-windows.zip"

          if ($Tag -ne "v$Version") {
            Write-Warning "Tag $Tag does not match VERSION $Version - publishing under $Tag"
          }

          # A release created from the GitHub web UI creates the tag itself,
          # which triggers this run with the release already in place. Creating
          # it again fails, so attach the build to the existing release instead.
          # Publishing must not depend on which way the tag was made.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $Tag *> $null
          $Exists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true

          if ($Exists) {
            Write-Host "Release $Tag already exists - uploading $Zip to it"
            gh release upload $Tag $Zip --clobber
          } else {
            Write-Host "Creating release $Tag"
            gh release create $Tag $Zip --generate-notes --title "Precious Metals Signage $Tag"
          }
